<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">Wongbot Vercel agent architecture</title>
  <desc id="desc">The browser calls a Next.js API route that manages rolling summaries and runs a LangGraph tool loop against Gemini and local content.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #fff; stroke: #334155; stroke-width: 2; rx: 12; }
      .blue { fill: #eff6ff; stroke: #2563eb; }
      .purple { fill: #eef2ff; stroke: #4f46e5; }
      .green { fill: #ecfdf5; stroke: #059669; }
      .label { fill: #0f172a; font: 600 17px system-ui, sans-serif; text-anchor: middle; }
      .detail { fill: #475569; font: 14px system-ui, sans-serif; text-anchor: middle; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .edge-label { fill: #334155; font: 13px system-ui, sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="650" rx="16"/>

  <rect class="box blue" x="50" y="70" width="230" height="90"/>
  <text class="label" x="165" y="107">Browser chat UI</text>
  <text class="detail" x="165" y="134">messages + hidden summary state</text>

  <rect class="box blue" x="420" y="70" width="280" height="90"/>
  <text class="label" x="560" y="107">Next.js /api/chat</text>
  <text class="detail" x="560" y="134">Vercel function + Upstash limits</text>

  <path class="edge" d="M280 115 H420"/>
  <text class="edge-label" x="350" y="99">request</text>
  <path class="edge" d="M420 142 H280"/>
  <text class="edge-label" x="350" y="174">SSE events</text>

  <rect class="box purple" x="50" y="285" width="280" height="105"/>
  <text class="label" x="190" y="323">Gemini summarizer</text>
  <text class="detail" x="190" y="350">five aged-out messages per batch</text>
  <text class="detail" x="190" y="372">300 output-token cap</text>

  <rect class="box purple" x="420" y="285" width="280" height="105"/>
  <text class="label" x="560" y="323">LangGraph primary node</text>
  <text class="detail" x="560" y="350">summary + latest 10 messages</text>
  <text class="detail" x="560" y="372">700 output-token cap</text>

  <path class="edge" d="M500 160 V225 H190 V285"/>
  <text class="edge-label" x="302" y="214">existing summary + aged-out batch</text>
  <path class="edge" d="M560 160 V285"/>
  <text class="edge-label" x="640" y="227">conversation context</text>
  <path class="edge" d="M330 337 H420"/>
  <text class="edge-label" x="375" y="321">updated summary</text>

  <rect class="box green" x="790" y="285" width="280" height="105"/>
  <text class="label" x="930" y="323">LangGraph tool node</text>
  <text class="detail" x="930" y="350">list/read posts and skills</text>

  <rect class="box green" x="790" y="495" width="280" height="90"/>
  <text class="label" x="930" y="532">Repository content</text>
  <text class="detail" x="930" y="559">Markdown skills + MDX posts</text>

  <path class="edge" d="M700 320 H790"/>
  <text class="edge-label" x="745" y="304">tool call</text>
  <path class="edge" d="M790 365 H700"/>
  <text class="edge-label" x="745" y="397">tool result</text>
  <path class="edge" d="M930 390 V495"/>
  <text class="edge-label" x="976" y="447">read</text>

  <path class="edge" d="M560 390 V470 H360 V160"/>
  <text class="edge-label" x="470" y="457">text + tool activity</text>

  <text class="detail" x="560" y="620">The complete agent runs inside the Vercel-hosted Next.js application.</text>
</svg>
